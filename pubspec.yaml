name: translate_cam
description: Camera app with Google Translate color palette
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  tflite_flutter: ^0.12.1
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_face_mesh_detection: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
